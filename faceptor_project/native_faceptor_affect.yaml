
common:

  solver:
    type: Solver

  seed: 2048
  cuda_deterministic: False
  fp16: True

  wandb:
    use: False
    key: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    suffix_run_name: None
    entity: entity
    project: project
    resume: False
    notes: 
    wandb_log_all: True
    save_artifacts: False

  num_workers: 4
  max_iter: 50000
  gradient_acc: 1
      
  backbone:
    type: FaRLVisualFeatures
    kwargs:
      model_type: base
      model_path: ./pretrain/FaRL-Base-Patch16-LAIONFace20M-ep64.pth
      drop_path_rate: 0.2
      forced_input_resolution: 512

  heads:
    type: TaskSpecificHeadsHolder
    kwargs: 
      subnets_cfg:
        recog:
          type: RecognitionHead
          kwargs:
            task_name: recog_ms1mv3
        age:
          type: SwinFaceHead
          kwargs:
            outputs: [101]
            indices: [5, 7, 9, 11]
            task_names: ["age_morph2"]
        biattr:
          type: SwinFaceHead
          kwargs:
            outputs: [40]
            indices: [5, 7, 9, 11]
            task_names: ["biattr_celeba"]    
        affect:
          type: SwinFaceHead
          kwargs:
            outputs: [7, 7]
            indices: [5, 7, 9, 11]
            task_names: ["affect_affectnet", "affect_rafdb"]   
        parsing:
          type: MMSEG_UPerHead
          kwargs:
            outputs: [19]
            out_types: ["ParsingOutput"]
            task_names: ["parsing_celebam"]
            indices: [3, 5, 7, 11]
            out_size: [512, 512]
        align:
          type: MMSEG_UPerHead
          kwargs:
            outputs: [68]
            out_types: ["AlignOutput"]
            task_names: ["align_300w"]
            indices: [3, 5, 7, 11]
            out_size: [512, 512]

  model_entry:
      type: aio_entry
      kwargs:
        size_group:
          group_0:
            task_types: ["recog", "age", "biattr", "affect"]
            input_size: 112
          group_1:
            task_types: ["parsing","align"]
            input_size: 512

  optimizer:
    type: AdamW
    kwargs:
      weight_decay: 0.05

  backbone_multiplier: 0.1
  heads_multiplier: 1.

  lr_scheduler:
    type: 'Cosine'
    kwargs:
      eta_min: 0.
      base_lr: 1.e-5
      warmup_lr: 5.e-4
      warmup_steps: 2000
  lr_base: 512
  lr_scale: False

  print_interval: 10
  save_interval: 5000
  evaluate_interval: 2500

  task_weight:
    recog: 1.0
    age: 1.0
    biattr: 1.0
    affect: 1.0
    parsing: 1.0
    align: 1.0


# For 2 Cards.
tasks:
  0:
    name: affect_rafdb
    loss_weight: 8.

    dataset:
      type: RAFDBDataset
      kwargs:
        data_path: ./data/RAF-DB/basic/
        augmentation:
          type: attribute_train_transform
          kwargs:
            input_size: 112
        train: True

    sampler:
      type: DistributedGivenIterationSampler
      batch_size: 8
      shuffle_strategy: 1

    loss:
      type: MyCrossEntropyLoss
      kwargs: {}

    evaluator:
      type: SingferEvaluator
      use: True
      kwargs: 
        mark: eval_rafdb_test
        test_batch_size: 32
        test_dataset_cfg:
          type: RAFDBDataset
          kwargs:
            data_path: ./data/RAF-DB/basic/
            augmentation:
              type: attribute_test_transform
              kwargs:
                input_size: 112
            train: False 
